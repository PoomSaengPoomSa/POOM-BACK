name: Deploy POOM-BACK
on:
  push:
    branches:
      - main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/poomsaengpoomsa/poom-back:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to BACK server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACK_SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.BASTION_HOST }}
          proxy_username: ${{ secrets.SERVER_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT,DB_NAME,JWT_SECRET_KEY,JWT_ALGORITHM,POOM_AI_URL,ES_HOST,LOGSTASH_HOST,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION,S3_BUCKET_NAME,CORS_ORIGINS
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u poomsaengpoomsa --password-stdin
            docker pull ghcr.io/poomsaengpoomsa/poom-back:latest
            docker stop poom-back || true
            docker rm poom-back || true
            docker run -d \
              --name poom-back \
              --restart unless-stopped \
              -p 8000:8000 \
              -e DB_USER="$DB_USER" \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e DB_HOST="$DB_HOST" \
              -e DB_PORT="$DB_PORT" \
              -e DB_NAME="$DB_NAME" \
              -e JWT_SECRET_KEY="$JWT_SECRET_KEY" \
              -e JWT_ALGORITHM="$JWT_ALGORITHM" \
              -e POOM_AI_URL="$POOM_AI_URL" \
              -e ES_HOST="$ES_HOST" \
              -e LOGSTASH_HOST="$LOGSTASH_HOST" \
              -e AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
              -e AWS_DEFAULT_REGION="$AWS_DEFAULT_REGION" \
              -e S3_BUCKET_NAME="$S3_BUCKET_NAME" \
              -e CORS_ORIGINS="CORS_ORIGINS" \
              ghcr.io/poomsaengpoomsa/poom-back:latest
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
          POOM_AI_URL: ${{ secrets.POOM_AI_URL }}
          ES_HOST: ${{ secrets.ES_HOST }}
          LOGSTASH_HOST: ${{ secrets.LOGSTASH_HOST }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
